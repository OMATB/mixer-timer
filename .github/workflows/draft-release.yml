# Makes a DRAFT release for each new folder releases/vX.Y.Z/ pushed to main.
# The folder must hold firmware.bin and version.txt (and may hold notes.md).
# Boards never see a draft. A person checks it on GitHub and clicks Publish,
# which also creates the vX.Y.Z tag.
name: Draft release from folder

on:
  push:
    branches: [main]
    paths:
      - 'releases/**'
      - '.github/workflows/draft-release.yml'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft releases for new folders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for DIR in releases/v*/; do
            DIR="${DIR%/}"
            TAG="$(basename "$DIR")"
            if [ ! -f "$DIR/firmware.bin" ] || [ ! -f "$DIR/version.txt" ]; then
              echo "::error::$TAG is missing firmware.bin or version.txt"
              exit 1
            fi
            VER="v$(tr -d '[:space:]' < "$DIR/version.txt")"
            if [ "$VER" != "$TAG" ]; then
              echo "::error::$DIR/version.txt says $VER but the folder is $TAG"
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already has a release, leaving it alone"
              continue
            fi
            NOTES="Created automatically. Check it, then click Publish."
            if [ -f "$DIR/notes.md" ]; then NOTES="$(cat "$DIR/notes.md")"; fi
            gh release create "$TAG" "$DIR/firmware.bin" "$DIR/version.txt" \
              --draft --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            echo "Draft release $TAG created"
          done
