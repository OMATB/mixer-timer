# Turns a pushed version tag (for example v1.1.3) into a DRAFT release.
# The firmware and version file are taken from releases/<tag>/ in the repository.
# Boards never see a draft. A person checks it on GitHub and clicks Publish.
name: Draft release from tag

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="releases/${TAG}"
          test -f "$DIR/firmware.bin" || { echo "Missing $DIR/firmware.bin"; exit 1; }
          test -f "$DIR/version.txt"  || { echo "Missing $DIR/version.txt";  exit 1; }
          VER="v$(tr -d '[:space:]' < "$DIR/version.txt")"
          if [ "$VER" != "$TAG" ]; then
            echo "version.txt says $VER but the tag is $TAG. Not creating a release."
            exit 1
          fi
          NOTES="Created automatically. Check it, then click Publish."
          if [ -f "$DIR/notes.md" ]; then NOTES="$(cat "$DIR/notes.md")"; fi
          gh release create "$TAG" "$DIR/firmware.bin" "$DIR/version.txt" \
            --draft --verify-tag --title "$TAG" --notes "$NOTES"
